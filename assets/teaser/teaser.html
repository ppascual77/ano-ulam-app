<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>AnoUlam Teaser</title>
<style>
  html, body { margin: 0; background: #111; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; width: auto; display: block; }
  body.capture canvas { height: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// AnoUlam "coming soon" teaser, 15s at 1080x1920.
// One hero: the orange dot, moving under a single real gravity constant
// (ballistic hops, bounces that lose energy, squash on impact, stretch
// with speed). Everything is a pure function of t, so capture.mjs steps it
// frame by frame (with sub-frame motion blur) and the sound cues come from
// the same timeline. Opened directly in a browser it loops as a preview.

const W = 1080, H = 1920, DURATION = 15;
const view = document.getElementById("c");
const vctx = view.getContext("2d");
// Scenes draw into `work`; renderFrame() blends sub-frames onto the view.
const work = document.createElement("canvas");
work.width = W; work.height = H;
const ctx = work.getContext("2d");

// Brand tokens (tailwind.config.js / constants/theme.ts).
const C = {
  green: "#286046",     // primary
  greenDark: "#18402F", // brand-green.dark
  orange: "#E36B17",    // accent
  ink: "#2B3437",       // ink.emphasis
  subtle: "#666666",    // ink.subtle
  cream: "#F2EDE1",     // tag.bg
  peach: "#FEF1E6",     // category.breakfast
  white: "#FFFFFF",
};

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const outQuint = (u) => 1 - Math.pow(1 - u, 5);
const inQuint = (u) => u ** 5;
const outCubic = (u) => 1 - Math.pow(1 - u, 3);
const inCubic = (u) => u ** 3;
const inOutQuart = (u) => (u < 0.5 ? 8 * u ** 4 : 1 - Math.pow(-2 * u + 2, 4) / 2);
const inOutCubic = (u) => (u < 0.5 ? 4 * u ** 3 : 1 - Math.pow(-2 * u + 2, 3) / 2);
const outBack = (u, s = 1.4) => 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2);
const inBack = (u, s = 1.4) => (s + 1) * u ** 3 - s * u * u;
function hash(...a) {
  let h = 2166136261;
  for (const v of a) { h ^= Math.round(v * 977) | 0; h = Math.imul(h, 16777619); }
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- physics
const G = 7000; // px/s², the one gravity everything obeys

// Ballistic flight from p0 (at t0) to p1 (at t1).
function toss(t, t0, t1, p0, p1) {
  const T = t1 - t0, tau = clamp(t - t0, 0, T);
  const vx = (p1.x - p0.x) / T, vy0 = (p1.y - p0.y) / T - 0.5 * G * T;
  return { x: p0.x + vx * tau, y: p0.y + vy0 * tau + 0.5 * G * tau * tau, vx, vy: vy0 + G * tau };
}
// Drop from rest at y0 onto a floor (center height yRest), bouncing with
// restitution e until it settles. Returns the impact list and a sampler.
function bounceTrack(t0, x, y0, yRest, e = 0.47) {
  const impacts = [];
  let t = t0 + Math.sqrt((2 * (yRest - y0)) / G), v = G * (t - t0);
  impacts.push({ t, v });
  while (v * e > 160) { const up = v * e; t += (2 * up) / G; v = up; impacts.push({ t, v }); }
  const at = (tt) => {
    if (tt < impacts[0].t) { const tau = tt - t0; return { x, y: y0 + 0.5 * G * tau * tau, vx: 0, vy: G * tau }; }
    for (let i = 0; i < impacts.length - 1; i++) {
      if (tt < impacts[i + 1].t) {
        const up = impacts[i + 1].v, tau = tt - impacts[i].t;
        return { x, y: yRest - up * tau + 0.5 * G * tau * tau, vx: 0, vy: -up + G * tau };
      }
    }
    return { x, y: yRest, vx: 0, vy: 0 };
  };
  return { impacts, at };
}

// ---------------------------------------------------------------- doodles (confetti only)
// Shapes from frontend/components/ui/doodles.tsx, 24x24 viewBox.
const ring = (cx, cy, r, n) => Array.from({ length: n }, (_, i) => {
  const a = (i / n) * Math.PI * 2; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
});
const DOODLES = [
  { strokes: [{ points: [[6, 4], [20, 12], [6, 20]], closed: true }], filled: true },
  { strokes: [{ points: Array.from({ length: 10 }, (_, i) => {
    const a = -Math.PI / 2 + (i * Math.PI) / 5; const r = i % 2 === 0 ? 10 : 4.2;
    return [12 + Math.cos(a) * r, 12 + Math.sin(a) * r]; }), closed: true }] },
  { strokes: [{ points: Array.from({ length: 23 }, (_, i) => {
    const a = i * 0.45; const r = 1.2 + a * 0.85; return [12 + Math.cos(a) * r, 12 + Math.sin(a) * r]; }) }] },
  { strokes: [{ points: ring(12, 12, 8, 24), closed: true }] },
  { strokes: [{ points: [[3, 9], [7, 5], [11, 9], [15, 5], [19, 9]] }, { points: [[5, 17], [9, 13], [13, 17], [17, 13], [21, 17]] }] },
  { strokes: [], dots: [[7, 16, 2.6], [12, 7, 2.6], [17.5, 15, 2.6]], filled: true },
];
function drawDoodle(d, x, y, size, rot, color, alpha) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(size / 24, size / 24); ctx.translate(-12, -12);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const s of d.strokes) {
    ctx.beginPath();
    s.points.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
    if (s.closed) ctx.closePath();
    ctx.stroke(); if (d.filled) ctx.fill();
  }
  for (const [cx, cy, r] of d.dots || []) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
// One restrained burst: a dozen pieces thrown up, light drag, same gravity.
function confetti(t, t0, x, y) {
  const dt = t - t0;
  if (dt < 0 || dt > 2.2) return;
  const N = 12, drag = 2.2;
  for (let i = 0; i < N; i++) {
    const r = (k) => hash(i, k, 5);
    const ang = -Math.PI / 2 + (i / (N - 1) - 0.5) * 2.3 + (r(1) - 0.5) * 0.25;
    const sp = 1500 + r(2) * 900;
    // Linear drag: v(t) = v0 e^{-kt} plus gravity toward terminal velocity.
    const e = Math.exp(-drag * dt), f = (1 - e) / drag;
    const px = x + Math.cos(ang) * sp * f;
    const py = y + Math.sin(ang) * sp * f + (G * 0.35 / drag) * (dt - f);
    const alpha = 1 - seg(dt, 1.3, 2.0);
    drawDoodle(DOODLES[i % DOODLES.length], px, py, 34 + r(3) * 14, (r(4) - 0.5) * 8 * f, i % 2 ? C.orange : C.green, alpha);
  }
}

// ---------------------------------------------------------------- wiggly line
// Smooth hand-drawn wave; `ripple` adds travelling waves from impacts.
function wiggleLine(x0, x1, y, { amp = 7, waves = 6, phase = 0, width = 9, color = C.green, from = 0, to = 1, ripple = null, alpha = 1 } = {}) {
  if (to <= from || alpha <= 0) return;
  const n = 120;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const s = lerp(from, to, i / n);
    const x = lerp(x0, x1, s);
    const yy = y + amp * Math.sin(2 * Math.PI * waves * s + phase) + (ripple ? ripple(x) : 0);
    i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
  }
  ctx.stroke();
  ctx.restore();
}

// ---------------------------------------------------------------- text
const FONT = (w, px) => `${w} ${px}px Inter`;
function measure(str, font, ls = 0) {
  ctx.save(); ctx.font = font; ctx.letterSpacing = `${ls}px`;
  const w = ctx.measureText(str).width; ctx.restore(); return w;
}
function text(str, x, y, font, color, ls = 0, align = "left") {
  ctx.save();
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.letterSpacing = `${ls}px`;
  ctx.fillText(str, x, y);
  ctx.restore();
}
// Words slide up out of a mask, then (at tOut) up and away into it.
function revealLine(words, x, y, size, { weight = 800, ls = -0.04, colors = [], tIn, tOut = 99, stagger = 0.07, dur = 0.85 } = {}) {
  const font = FONT(weight, size), lsPx = ls * size;
  const space = measure(" ", font, lsPx);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, y - size * 1.02, W, size * 1.32); ctx.clip();
  let cx = x;
  words.forEach((wd, i) => {
    const uIn = outQuint(seg(performanceT - tIn - i * stagger, 0, dur));
    const uOut = inCubic(seg(performanceT - tOut - i * stagger * 0.5, 0, 0.42));
    const dy = (1 - uIn) * size * 1.2 - uOut * size * 1.25;
    if (uIn > 0 && uOut < 1) text(wd, cx, y + dy, font, colors[i] || C.ink, lsPx);
    cx += measure(wd, font, lsPx) + space;
  });
  ctx.restore();
}
function lineWidth(words, size, weight = 800, ls = -0.04) {
  const font = FONT(weight, size), lsPx = ls * size;
  return measure(words.join(" "), font, lsPx);
}
let performanceT = 0; // the t being drawn, read by revealLine

// ---------------------------------------------------------------- images
const IMG = {};
const loadImg = (key, src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => { IMG[key] = im; res(); }; im.onerror = rej; im.src = src; });
// Tinted copy of a raster; up > 1 redraws it bigger and re-sharpens the
// alpha edge, so the 255px logo stays crisp at 500px+.
function tinted(im, color, clipBottom = null, up = 1) {
  const c = document.createElement("canvas");
  c.width = im.width * up; c.height = im.height * up;
  const g = c.getContext("2d");
  g.imageSmoothingQuality = "high";
  g.drawImage(im, 0, 0, c.width, c.height);
  if (clipBottom != null) g.clearRect(0, clipBottom * up, c.width, c.height);
  if (up > 1) {
    const d = g.getImageData(0, 0, c.width, c.height);
    for (let i = 3; i < d.data.length; i += 4) d.data[i] = clamp((d.data[i] - 128) * 3 + 128, 0, 255);
    g.putImageData(d, 0, 0);
  }
  g.globalCompositeOperation = "source-in";
  g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}
// logo_white.png is 255x374; its "?" dot sits at rows 313-370, x 3-77.
const LOGO_W = 255, LOGO_H = 374, LOGO_DOT = { x: 40, y: 341.5, rx: 37.5, ry: 29 };
function logoDot(L) {
  const k = L.h / LOGO_H;
  return { x: L.cx + (LOGO_DOT.x - LOGO_W / 2) * k, y: L.cy + (LOGO_DOT.y - LOGO_H / 2) * k, rx: LOGO_DOT.rx * k, ry: LOGO_DOT.ry * k };
}
// The "?" body (no dot) grows out of its dot: scale pivots on the dot.
function drawLogoBody(L, s, rot = 0) {
  if (s <= 0.001) return;
  const d = logoDot(L);
  const w = (L.h * LOGO_W) / LOGO_H;
  ctx.save();
  ctx.translate(d.x, d.y); ctx.rotate(rot); ctx.scale(s, s); ctx.translate(-d.x, -d.y);
  ctx.drawImage(IMG.logoNoDot, L.cx - w / 2, L.cy - L.h / 2, w, L.h);
  ctx.restore();
}

// ======================================================================
// Layout
// ======================================================================
const FLOOR = { y: 1040, x0: 250, x1: 830 };
const R1 = 30; // the dot on its own
const HEAD = { size: 156, lines: [["Ano", "ulam"], ["mo", "today"]], y: [850, 1020] };
const FEAT = { size: 118, y: 990, r: 22, items: [["Plan", "your", "week"], ["Watch", "prices"], ["Discover", "ulam"]] };
const LOGO = { cx: 540, cy: 760, h: 500 };
const WORD_Y = 1255;

function headLayout() {
  const logoH = 196, logoW = (logoH * LOGO_W) / LOGO_H, gap = 14;
  const w0 = lineWidth(HEAD.lines[0], HEAD.size), w1 = lineWidth(HEAD.lines[1], HEAD.size) + gap + logoW;
  const x = (W - Math.max(w0, w1)) / 2;
  const L = { cx: x + lineWidth(HEAD.lines[1], HEAD.size) + gap + logoW / 2, cy: HEAD.y[1] + 6 - logoH / 2, h: logoH };
  return { x, L };
}
function featDot(i) {
  const w = lineWidth(FEAT.items[i], FEAT.size);
  const x = (W - (w + 12 + 2 * FEAT.r)) / 2;
  return { x0: x, x: x + w + 12 + FEAT.r, y: FEAT.y - FEAT.r };
}

// ======================================================================
// Timeline (seconds)
// ======================================================================
const T = {
  drop: 0.4,
  crouch1: 2.34, jump1: 2.5, land1: 3.3,        // floor -> the "?"
  headIn: 2.58, headOut: 4.5, logoOut: 4.55, fall: 4.85, fallEnd: 5.6,
  panelIn: 5.25, panelInB: 5.95,
  rise: 5.75, feats: [6.55, 8.05, 9.45], hops: [7.35, 8.75], featIn: [6.1, 7.68, 9.08], featOut: [7.3, 8.7, 10.0],
  toLogo: 10.1, logoLand: 10.9, panelOut: 10.15, panelOutB: 10.85,
  wordIn: 11.2, wordOut: 12.2, soonIn: 12.35, underline: 12.95, pills: [12.95, 13.1],
  wink: 14.0,
};
const DROP = bounceTrack(T.drop, 540, -60, FLOOR.y - R1);
const WINK_T = Math.sqrt((8 * 150) / G);

// ======================================================================
// The dot's whole journey: position, velocity, size.
// ======================================================================
function dot(t) {
  const H0 = headLayout(), hd = logoDot(H0.L);
  const floorP = { x: 540, y: FLOOR.y - R1 };
  if (t < T.drop) return null;
  if (t < T.jump1) return { ...DROP.at(t), r: R1 };
  if (t < T.land1) {
    const p = toss(t, T.jump1, T.land1, floorP, hd);
    const u = seg(t, T.jump1, T.land1);
    return { ...p, rx: lerp(R1, hd.rx, u), ry: lerp(R1, hd.ry, u) };
  }
  if (t < T.fall) return { ...hd, vx: 0, vy: 0 };
  // Falls out the bottom (from a small hop up, as the "?" lets go of it).
  const out = { x: hd.x + 90, y: H + 120 };
  if (t < T.fallEnd + 0.2) {
    const u = seg(t, T.fall, T.fall + 0.25);
    return { ...toss(t, T.fall, T.fallEnd, hd, out), rx: lerp(hd.rx, FEAT.r, u), ry: lerp(hd.ry, FEAT.r, u) };
  }
  // Thrown back up from below onto each feature's period, hopping on.
  const F = [0, 1, 2].map(featDot);
  if (t < T.rise) return null;
  if (t < T.feats[0]) return { ...toss(t, T.rise, T.feats[0], { x: F[0].x - 160, y: H + 60 }, F[0]), r: FEAT.r };
  if (t < T.hops[0]) return { ...F[0], vx: 0, vy: 0, r: FEAT.r };
  if (t < T.feats[1]) return { ...toss(t, T.hops[0], T.feats[1], F[0], F[1]), r: FEAT.r };
  if (t < T.hops[1]) return { ...F[1], vx: 0, vy: 0, r: FEAT.r };
  if (t < T.feats[2]) return { ...toss(t, T.hops[1], T.feats[2], F[1], F[2]), r: FEAT.r };
  if (t < T.toLogo) return { ...F[2], vx: 0, vy: 0, r: FEAT.r };
  // Up and over into the big logo's dot.
  const ld = logoDot(LOGO);
  if (t < T.logoLand) {
    const u = seg(t, T.toLogo, T.logoLand);
    return { ...toss(t, T.toLogo, T.logoLand, F[2], ld), rx: lerp(FEAT.r, ld.rx, u), ry: lerp(FEAT.r, ld.ry, u) };
  }
  // A last little hop, like a wink.
  if (t > T.wink && t < T.wink + WINK_T) return { ...toss(t, T.wink, T.wink + WINK_T, ld, ld), rx: ld.rx, ry: ld.ry };
  return { ...ld, vx: 0, vy: 0 };
}

// Impacts: when the dot lands, and how hard (for squash and sound).
function landings() {
  const L = DROP.impacts.map((i) => ({ t: i.t, v: i.v }));
  const vAt = (t0, t1, a, b) => toss(t1 - 1e-4, t0, t1, a, b).vy;
  const H0 = headLayout(), hd = logoDot(H0.L), F = [0, 1, 2].map(featDot), ld = logoDot(LOGO);
  L.push({ t: T.land1, v: vAt(T.jump1, T.land1, { x: 540, y: FLOOR.y - R1 }, hd) });
  L.push({ t: T.feats[0], v: vAt(T.rise, T.feats[0], { x: F[0].x - 160, y: H + 60 }, F[0]) });
  L.push({ t: T.feats[1], v: vAt(T.hops[0], T.feats[1], F[0], F[1]) });
  L.push({ t: T.feats[2], v: vAt(T.hops[1], T.feats[2], F[1], F[2]) });
  L.push({ t: T.logoLand, v: vAt(T.toLogo, T.logoLand, F[2], ld) });
  L.push({ t: T.wink + WINK_T, v: G * WINK_T / 2 });
  return L;
}
const TAKEOFFS = () => [T.jump1, T.hops[0], T.hops[1], T.toLogo, T.wink];
let LANDINGS = null;

function drawDot(t) {
  const d = dot(t);
  if (!d) return;
  let rx = d.rx ?? d.r, ry = d.ry ?? d.r;
  let sx = 1, sy = 1, rot = 0, lift = 0;
  // Stretch along the direction of travel, with speed.
  const v = Math.hypot(d.vx || 0, d.vy || 0);
  if (v > 1) { const k = Math.min(0.32, v / 11000); sx = 1 + k; sy = 1 / (1 + k); rot = Math.atan2(d.vy, d.vx); }
  // Squash on impact, harder the faster it landed, springing back.
  let q = 0;
  for (const L of LANDINGS) {
    const dt = t - L.t;
    if (dt >= 0 && dt < 0.6) q += Math.min(0.42, L.v / 9000) * Math.exp(-13 * dt) * Math.cos(2 * Math.PI * 4.2 * dt);
  }
  // Crouch before take-off.
  for (const tk of TAKEOFFS()) {
    const u = seg(t, tk - 0.17, tk);
    if (u > 0 && u < 1) q += 0.22 * Math.sin(Math.PI * u * 0.92);
  }
  if (q !== 0) {
    // Squash is about the ground: wider, shorter, bottom stays put.
    const qx = 1 + q, qy = 1 - q;
    ctx.save(); ctx.fillStyle = C.orange;
    ctx.translate(d.x, d.y + ry * (1 - qy));
    ctx.rotate(rot); ctx.scale(sx, sy); ctx.rotate(-rot);
    ctx.beginPath(); ctx.ellipse(0, 0, rx * qx, ry * qy, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    return;
  }
  ctx.save(); ctx.fillStyle = C.orange;
  ctx.translate(d.x, d.y); ctx.rotate(rot); ctx.scale(sx, sy); ctx.rotate(-rot);
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ======================================================================
// Scenes
// ======================================================================
function sceneOpen(t) {
  // The floor: draws out from the first impact, ripples on each bounce,
  // then pulls back into the middle as the dot leaves.
  const first = DROP.impacts[0].t;
  if (t > first && t < T.jump1 + 0.6) {
    const grow = outQuint(seg(t, first, first + 0.9));
    const shrink = inCubic(seg(t, T.jump1 - 0.02, T.jump1 + 0.42));
    const half = 0.5 * grow * (1 - shrink);
    const ripple = (x) => {
      let y = 0;
      for (const i of DROP.impacts) {
        const dt = t - i.t; if (dt < 0) continue;
        const dist = Math.abs(x - 540);
        y += (i.v / 3870) * 26 * Math.exp(-4.5 * dt) * Math.exp(-dist / 260) * Math.cos(dist / 38 - dt * 22);
      }
      // The take-off pushes the line down too.
      const u = seg(t, T.crouch1, T.jump1 + 0.3);
      y += 14 * Math.sin(Math.PI * u) * Math.exp(-Math.pow((x - 540) / 120, 2));
      return y;
    };
    wiggleLine(FLOOR.x0, FLOOR.x1, FLOOR.y + 4, { from: 0.5 - half, to: 0.5 + half, phase: t * 1.5, ripple });
  }

  // "Ano ulam / mo today?" with the "?" grown from the dot.
  if (t > T.headIn - 0.1 && t < T.fall + 0.4) {
    const { x, L } = headLayout();
    revealLine(HEAD.lines[0], x, HEAD.y[0], HEAD.size, { tIn: T.headIn, tOut: T.headOut, colors: [C.ink, C.green] });
    revealLine(HEAD.lines[1], x, HEAD.y[1], HEAD.size, { tIn: T.headIn + 0.14, tOut: T.headOut + 0.06 });
    const grow = outBack(seg(t, T.land1 + 0.02, T.land1 + 0.62), 1.6);
    const shrink = inBack(seg(t, T.logoOut, T.logoOut + 0.28), 1.6);
    const rot = -0.5 * (1 - seg(t, T.land1, T.land1 + 0.5)) ** 3;
    drawLogoBody(L, Math.max(0, grow * (1 - shrink)), rot);
  }
}

function sceneFeatures(t) {
  for (let i = 0; i < 3; i++) {
    const f = featDot(i);
    revealLine(FEAT.items[i], f.x0, FEAT.y, FEAT.size, { tIn: T.featIn[i], tOut: T.featOut[i], colors: FEAT.items[i].map(() => C.white), stagger: 0.06 });
  }
  // Small kicker above the line.
  const a = seg(t, 6.0, 6.5) * (1 - seg(t, 9.95, 10.25));
  if (a > 0) {
    ctx.save(); ctx.globalAlpha = a;
    text("ANOULAM HELPS YOU", 540, 760, FONT(600, 30), C.peach, 7, "center");
    ctx.restore();
  }
}

function sceneLogo(t) {
  if (t < T.logoLand - 0.05) return;
  // The "?" grows out of the dot, settling with a little sway.
  const s = outBack(seg(t, T.logoLand, T.logoLand + 0.75), 1.5);
  const rot = -0.35 * (1 - seg(t, T.logoLand, T.logoLand + 0.7)) ** 3;
  drawLogoBody(LOGO, s, rot);
  confetti(t, T.logoLand, logoDot(LOGO).x, logoDot(LOGO).y);

  revealLine(["AnoUlam"], (W - lineWidth(["AnoUlam"], 120)) / 2, WORD_Y, 120, { tIn: T.wordIn, tOut: T.wordOut, colors: [C.ink] });
  const soon = ["Coming", "soon"];
  const sw = lineWidth(soon, 120);
  const sx = (W - sw) / 2;
  revealLine(soon, sx, WORD_Y, 120, { tIn: T.soonIn, colors: [C.ink, C.green] });
  const soonX = sx + lineWidth(["Coming", ""], 120);
  wiggleLine(soonX + 4, sx + sw, WORD_Y + 46, { amp: 6, waves: 3.5, width: 9, color: C.orange, to: outQuint(seg(t, T.underline, T.underline + 0.7)), phase: t * 2 });

  // Store buttons, side by side.
  const stores = [["Google Play", IMG.google], ["App Store", IMG.appleWhite]];
  stores.forEach(([name, icon], i) => {
    const u = outQuint(seg(t, T.pills[i], T.pills[i] + 0.9));
    if (u <= 0) return;
    const w = 400, h = 116, cx = 540 + (i ? 1 : -1) * (w / 2 + 14), cy = 1500 + (1 - u) * 60;
    ctx.save(); ctx.globalAlpha = u;
    ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2); ctx.fill();
    const isz = 50, tw = measure(name, FONT(700, 40), -0.5);
    const x0 = cx - (isz + 18 + tw) / 2;
    ctx.drawImage(icon, x0, cy - isz / 2 - (i ? 3 : 0), isz, isz);
    text(name, x0 + isz + 18, cy + 14, FONT(700, 40), C.white, -0.5);
    ctx.restore();
  });
  const a = seg(t, 13.3, 13.9);
  if (a > 0) { ctx.save(); ctx.globalAlpha = a; text("Tara, kain!", 540, 1690, "700 76px Caveat", C.orange, 0, "center"); ctx.restore(); }
}

// A full-screen green panel with a soft wavy edge that only waves while it moves.
function panel(top, bottom, motion, t) {
  ctx.fillStyle = C.green;
  ctx.beginPath();
  const amp = 46 * Math.sin(Math.PI * motion);
  const edge = (x, y0) => y0 + amp * Math.sin(x / 150 + t * 3);
  ctx.moveTo(-10, edge(-10, top));
  for (let x = -10; x <= W + 10; x += 15) ctx.lineTo(x, edge(x, top));
  for (let x = W + 10; x >= -10; x -= 15) ctx.lineTo(x, edge(x, bottom));
  ctx.closePath(); ctx.fill();
}

function render(t) {
  performanceT = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);

  sceneOpen(t);
  sceneLogo(t);

  // Green rises from below for the features, then lifts away upward.
  if (t > T.panelIn && t < T.panelOutB) {
    const uIn = inOutQuart(seg(t, T.panelIn, T.panelInB));
    const uOut = inOutQuart(seg(t, T.panelOut, T.panelOutB));
    const top = lerp(H + 120, -120, uIn) - uOut * (H + 240);
    const bottom = H + 120 - uOut * (H + 240);
    panel(top, bottom, uIn < 1 ? uIn : uOut, t);
    ctx.save(); ctx.beginPath(); ctx.rect(0, Math.max(0, top), W, bottom - Math.max(0, top)); ctx.clip();
    sceneFeatures(t);
    ctx.restore();
  }

  drawDot(t);
}

// Motion blur: average `n` sub-frames across a 180° shutter.
function renderFrame(t, fps = 60, n = 6) {
  vctx.globalAlpha = 1;
  for (let i = 0; i < n; i++) {
    const ts = t + ((i + 0.5) / n - 0.5) * (0.5 / fps);
    render(Math.max(0, ts));
    vctx.globalAlpha = 1 / (i + 1);
    vctx.drawImage(work, 0, 0);
  }
  vctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- sound cues
// [time, cue, strength 0..1, extra]. synth-audio.py builds the soundtrack.
const CUES = () => [
  ...LANDINGS.map((L, i) => [L.t, "land", clamp(L.v / 3900, 0.12, 1), i]),
  ...TAKEOFFS().map((tk) => [tk, "lift", 1, 0]),
  [T.land1 + 0.02, "grow", 1, 0],
  [T.fall, "fall", 1, 0],
  [T.panelIn, "swell", 1, 0],
  [T.logoLand, "reveal", 1, 0],
  [T.soonIn, "soon", 1, 0],
];

// ---------------------------------------------------------------- boot
const ROOT = "../../";
async function boot() {
  const fonts = [
    ["Inter", "node_modules/@expo-google-fonts/inter/600SemiBold/Inter_600SemiBold.ttf", "600"],
    ["Inter", "node_modules/@expo-google-fonts/inter/700Bold/Inter_700Bold.ttf", "700"],
    ["Inter", "node_modules/@expo-google-fonts/inter/800ExtraBold/Inter_800ExtraBold.ttf", "800"],
    ["Caveat", "node_modules/@expo-google-fonts/caveat/700Bold/Caveat_700Bold.ttf", "700"],
  ];
  await Promise.all(fonts.map(async ([fam, url, weight]) => {
    const f = new FontFace(fam, `url(${ROOT}${url})`, { weight }); await f.load(); document.fonts.add(f);
  }));
  await Promise.all([
    loadImg("logo", ROOT + "assets/icons/logo_white.png"),
    loadImg("apple", ROOT + "assets/icons/apple-logo.png"),
    loadImg("google", ROOT + "assets/icons/google-logo.png"),
  ]);
  IMG.logoNoDot = tinted(IMG.logo, C.green, 309, 4);
  IMG.appleWhite = tinted(IMG.apple, C.white);
  LANDINGS = landings();
  window.renderFrame = renderFrame;
  window.CUES = CUES;
  window.DURATION = DURATION;
  window.ready = true;
  if (location.hash !== "#capture") {
    const t0 = performance.now();
    const loop = () => { renderFrame(((performance.now() - t0) / 1000) % DURATION, 60, 2); requestAnimationFrame(loop); };
    loop();
  } else document.body.classList.add("capture");
}
boot();
</script>
